<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EcoCycle – Recycling & Waste Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { forest: '#176B4D', leaf: '#8DBF67', mint: '#E5F3E8', ivory: '#F6F7EF', charcoal: '#26352B', sage: '#68776C', sun: '#F2B84B' },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'] },
                    boxShadow: { soft: '0 6px 24px -10px rgba(23,107,77,.25)', lift: '0 14px 34px -14px rgba(23,107,77,.35)' }
                }
            }
        }
    </script>
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        html {
            scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px);
            scroll-behavior: smooth;
        }

        body {
            background: #F6F7EF;
            color: #26352B;
            font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        :focus-visible {
            outline: 3px solid #F2B84B;
            outline-offset: 2px;
            border-radius: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes sway {

            0%,
            100% {
                transform: rotate(-2deg);
            }

            50% {
                transform: rotate(2deg);
            }
        }

        .rise {
            animation: rise .7s ease both;
        }

        .sway {
            transform-origin: bottom center;
            animation: sway 6s ease-in-out infinite;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

        /* ============================== UTILITIES ============================== */
        const cx = (...a) => a.filter(Boolean).join(' ');
        const pad = n => String(n).padStart(2, '0');
        const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const todayISO = () => toISO(new Date());
        const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
        const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
        const fmtDate = s => parseISO(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const fmtTime = t => { const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${pad(m)} ${h >= 12 ? 'PM' : 'AM'}`; };
        const refId = p => `${p}-${Math.floor(100000 + Math.random() * 900000)}`;
        const uid = () => Math.random().toString(36).slice(2, 9);
        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        function usePersist(key, initial) {
            const [v, setV] = useState(() => {
                try { const raw = localStorage.getItem(key); if (raw) return JSON.parse(raw); } catch (e) { }
                return initial;
            });
            useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { } }, [key, v]);
            return [v, setV];
        }

        /* ============================== ICONS ============================== */
        const ICONS = {
            menu: 'M4 6h16M4 12h16M4 18h16', x: 'M18 6 6 18M6 6l12 12', check: 'M20 6 9 17l-5-5',
            search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',
            truck: 'M10 17h4V5H2v12h3M14 9h4l4 4v4h-3M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
            alert: 'M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
            pin: 'M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
            book: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5',
            leaf: 'M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10zM2 21c0-3 1.9-5.4 5-7',
            grid: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z', list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
            calendar: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
            bell: 'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',
            trash: 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6', edit: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
            phone: 'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z',
            clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
            users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
            ext: 'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3',
            upload: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12', plus: 'M12 5v14M5 12h14',
            arrow: 'M5 12h14M12 5l7 7-7 7', left: 'M19 12H5M12 19l-7-7 7-7', chev: 'm9 18 6-6-6-6', chevl: 'm15 18-6-6 6-6',
            scale: 'M12 3v18M5 7h14M5 7l-3 8a4 4 0 0 0 6 0zM19 7l-3 8a4 4 0 0 0 6 0z',
            mail: 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM22 6l-10 7L2 6',
            trophy: 'M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17c0 .6-.5 1-1.2 1.2C7.8 18.7 7 20.2 7 22M14 14.7V17c0 .6.5 1 1.2 1.2 1 .5 1.8 2 1.8 3.8M18 2H6v7a6 6 0 0 0 12 0z',
            zap: 'M13 2 3 14h9l-1 8 10-12h-9z', info: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01',
            share: 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13',
            heart: 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.3l7.8-7.8 1-1.1a5.5 5.5 0 0 0 0-7.8z',
            globe: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z',
            camera: 'M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
            trend: 'M23 6l-9.5 9.5-5-5L1 18M17 6h6v6', flag: 'M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7',
            sprout: 'M7 20h10M10 20c5.5-2.5.8-6.4 3-10M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8zM14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z',
            loader: 'M21 12a9 9 0 1 1-6.2-8.6',
        };
        function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth}
                    strokeLinecap="round" strokeLinejoin="round" className={cx('shrink-0', className)} aria-hidden="true">
                    <path d={ICONS[name] || ICONS.leaf} />
                </svg>
            );
        }

        /* ============================== ILLUSTRATIONS ============================== */
        function HeroIllustration() {
            return (
                <svg viewBox="0 0 560 480" role="img" aria-label="Illustration of recycling bins in front of a green neighborhood with trees and homes" className="w-full h-auto">
                    <rect width="560" height="480" rx="28" fill="#E5F3E8" />
                    <circle cx="450" cy="92" r="46" fill="#F2B84B" />
                    <circle cx="450" cy="92" r="64" fill="#F2B84B" opacity=".18" />
                    <path d="M0 330 C90 250 170 260 250 300 C340 240 450 230 560 300 V480 H0Z" fill="#8DBF67" opacity=".55" />
                    <path d="M0 370 C110 310 200 330 290 355 C380 320 480 310 560 350 V480 H0Z" fill="#8DBF67" />
                    <path d="M0 410 C120 380 260 400 380 392 C450 388 510 380 560 388 V480 H0Z" fill="#176B4D" />
                    {/* houses */}
                    <g>
                        <rect x="52" y="262" width="82" height="62" fill="#FFFFFF" /><path d="M42 266 93 222 144 266Z" fill="#176B4D" />
                        <rect x="80" y="288" width="22" height="36" fill="#E5F3E8" /><rect x="58" y="276" width="14" height="14" fill="#E5F3E8" />
                        <rect x="146" y="282" width="66" height="50" fill="#F6F7EF" /><path d="M138 286 179 250 220 286Z" fill="#26352B" />
                        <rect x="168" y="304" width="20" height="28" fill="#8DBF67" />
                    </g>
                    {/* trees */}
                    <g className="sway"><rect x="408" y="268" width="10" height="66" fill="#26352B" /><circle cx="413" cy="252" r="38" fill="#176B4D" /><circle cx="388" cy="276" r="26" fill="#8DBF67" /><circle cx="440" cy="278" r="24" fill="#8DBF67" /></g>
                    <g className="sway" style={{ animationDelay: '-2s' }}><rect x="500" y="298" width="8" height="46" fill="#26352B" /><circle cx="504" cy="288" r="26" fill="#176B4D" /></g>
                    {/* bins */}
                    <g>
                        <rect x="150" y="318" width="92" height="116" rx="10" fill="#176B4D" /><rect x="142" y="306" width="108" height="20" rx="8" fill="#145a41" />
                        <rect x="224" y="372" width="0" height="0" />
                        <g transform="translate(196 372)" fill="none" stroke="#fff" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"><path d="M-14 6 -4 -12 6 6M-4 -12 4 -2M-14 6h10M6 6l-10 0" opacity="0" /><path d="M-16 8 -6 -10h12M8 -4 14 6 6 18H-6M-6 18 -12 10" /></g>
                    </g>
                    <g>
                        <rect x="262" y="332" width="84" height="102" rx="10" fill="#F2B84B" /><rect x="254" y="320" width="100" height="20" rx="8" fill="#d99f35" />
                        <circle cx="304" cy="384" r="16" fill="none" stroke="#26352B" strokeWidth="5" /><path d="M296 384l6 6 11-12" fill="none" stroke="#26352B" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" />
                    </g>
                    <g>
                        <rect x="358" y="346" width="70" height="88" rx="10" fill="#FFFFFF" stroke="#176B4D" strokeWidth="3" /><rect x="351" y="335" width="84" height="18" rx="8" fill="#8DBF67" />
                        <path d="M376 392c8-14 24-14 32 0M376 410h32" fill="none" stroke="#176B4D" strokeWidth="5" strokeLinecap="round" />
                    </g>
                    {/* floating items */}
                    <g fill="#FFFFFF" stroke="#176B4D" strokeWidth="3"><rect x="88" y="110" width="40" height="56" rx="10" transform="rotate(-14 108 138)" /><path d="M96 108h24" /></g>
                    <g transform="translate(232 82)"><circle r="30" fill="#FFFFFF" /><g fill="none" stroke="#176B4D" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" transform="translate(-14 -14) scale(1.17)"><path d={ICONS.leaf} /></g></g>
                    <circle cx="330" cy="150" r="7" fill="#176B4D" opacity=".5" /><circle cx="170" cy="190" r="5" fill="#8DBF67" /><circle cx="520" cy="190" r="6" fill="#F2B84B" />
                </svg>
            );
        }
        const THUMB = {
            'Waste Segregation': ['#176B4D', '#8DBF67', 'grid'], 'Plastic Recycling': ['#26352B', '#8DBF67', 'recycle'],
            'Paper and Cardboard': ['#F2B84B', '#F6F7EF', 'book'], 'Glass and Metal': ['#68776C', '#E5F3E8', 'scale'],
            'Electronic Waste': ['#26352B', '#F2B84B', 'zap'], 'Composting': ['#8DBF67', '#176B4D', 'sprout'],
            'Sustainable Living': ['#176B4D', '#E5F3E8', 'globe'], 'Reduce, Reuse, Recycle': ['#8DBF67', '#26352B', 'leaf'],
        };
        function Thumb({ kind, className = '', label }) {
            const [a, b, ic] = THUMB[kind] || ['#176B4D', '#8DBF67', 'leaf'];
            const icon = ic === 'recycle' ? 'leaf' : ic;
            return (
                <div className={cx('relative overflow-hidden', className)} role="img" aria-label={label || `${kind} illustration`} style={{ background: a }}>
                    <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" className="absolute inset-0 w-full h-full" aria-hidden="true">
                        <circle cx="270" cy="30" r="90" fill={b} opacity=".28" /><circle cx="30" cy="190" r="80" fill={b} opacity=".22" />
                        <path d="M0 150 C80 110 160 170 320 120 V200 H0Z" fill={b} opacity=".4" />
                        <g transform="translate(120 56) scale(3.4)" fill="none" stroke={b === '#F6F7EF' || b === '#E5F3E8' ? b : '#fff'} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"><path d={ICONS[icon]} /></g>
                    </svg>
                </div>
            );
        }
        const CENTER_COLORS = { 'Drop-off Center': 'Waste Segregation', 'Buy-back Center': 'Glass and Metal', 'E-waste Facility': 'Electronic Waste', 'Composting Site': 'Composting', 'Community Hub': 'Sustainable Living' };

        /* ============================== CONTEXT ============================== */
        const AppCtx = createContext(null);
        const useApp = () => useContext(AppCtx);

        /* ============================== UI COMPONENTS ============================== */
        function Btn({ variant = 'primary', size = 'md', to, href, className = '', icon, iconRight, children, loading, ...rest }) {
            const base = 'inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition-all duration-200 min-h-[44px] disabled:opacity-60 disabled:cursor-not-allowed select-none';
            const sizes = { sm: 'px-3.5 text-sm min-h-[40px]', md: 'px-5 text-[15px]', lg: 'px-7 text-base min-h-[52px]' };
            const variants = {
                primary: 'bg-forest text-white hover:bg-[#12583f] shadow-soft hover:shadow-lift',
                outline: 'bg-white text-forest border border-forest/30 hover:border-forest hover:bg-mint',
                light: 'bg-white text-forest hover:bg-mint',
                soft: 'bg-mint text-forest hover:bg-[#d6ecda]',
                ghost: 'text-charcoal hover:bg-mint',
                danger: 'bg-white text-[#9b2c2c] border border-[#9b2c2c]/30 hover:bg-[#fdeeee]',
                sun: 'bg-sun text-charcoal hover:brightness-95',
            };
            const cls = cx(base, sizes[size], variants[variant], className);
            const inner = <>{loading ? <Icon name="loader" className="animate-spin" size={18} /> : icon && <Icon name={icon} size={18} />}{children}{iconRight && <Icon name={iconRight} size={18} />}</>;
            if (to) return <a href={'#' + to} className={cls} {...rest}>{inner}</a>;
            if (href) return <a href={href} target="_blank" rel="noopener noreferrer" className={cls} {...rest}>{inner}</a>;
            return <button type="button" className={cls} disabled={loading || rest.disabled} {...rest}>{inner}</button>;
        }
        function Card({ className = '', children, hover, ...rest }) {
            const hasBg = /(^|\s)bg-/.test(className);
            const noBorder = /(^|\s)border-0(\s|$)/.test(className);
            return <div className={cx(!hasBg && 'bg-white', !noBorder && 'border border-forest/10', 'rounded-2xl shadow-soft', hover && 'transition duration-200 hover:-translate-y-0.5 hover:shadow-lift', className)} {...rest}>{children}</div>;
        }
        const BADGE = {
            Pending: 'bg-sun/25 text-[#6b4a00]', Confirmed: 'bg-mint text-forest', Scheduled: 'bg-forest text-white', Collected: 'bg-leaf/35 text-[#0f4a34]', Cancelled: 'bg-stone-200 text-stone-600',
            Submitted: 'bg-sun/25 text-[#6b4a00]', 'Under Review': 'bg-mint text-forest', 'In Progress': 'bg-forest text-white', Resolved: 'bg-leaf/35 text-[#0f4a34]',
        };
        function StatusBadge({ status }) {
            return <span className={cx('inline-flex items-center rounded-full px-2.5 py-1 text-xs font-bold whitespace-nowrap', BADGE[status] || 'bg-mint text-forest')}>{status}</span>;
        }
        function Chip({ children, tone = 'mint' }) {
            const t = { mint: 'bg-mint text-forest', sun: 'bg-sun/25 text-[#6b4a00]', white: 'bg-white/90 text-forest', gray: 'bg-ivory text-sage border border-forest/10' }[tone];
            return <span className={cx('inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold', t)}>{children}</span>;
        }
        function Field({ label, error, required, hint, id, children }) {
            return (
                <div>
                    <label htmlFor={id} className="block text-sm font-semibold mb-1.5">{label}{required && <span className="text-forest" aria-hidden="true"> *</span>}</label>
                    {children}
                    {hint && !error && <p className="text-xs text-sage mt-1">{hint}</p>}
                    {error && <p id={id + '-err'} role="alert" className="text-xs font-semibold text-[#b03030] mt-1.5 flex items-center gap-1"><Icon name="alert" size={14} />{error}</p>}
                </div>
            );
        }
        const inp = (err) => cx('w-full rounded-xl border bg-white px-3.5 min-h-[46px] text-[15px] text-charcoal placeholder:text-sage/70 transition focus:outline-none focus:ring-2 focus:ring-forest/40 focus:border-forest', err ? 'border-[#b03030]' : 'border-forest/20');
        function Input({ label, error, required, hint, id, ...rest }) {
            return <Field label={label} error={error} required={required} hint={hint} id={id}><input id={id} aria-invalid={!!error} aria-describedby={error ? id + '-err' : undefined} className={inp(error)} {...rest} /></Field>;
        }
        function Select({ label, error, required, id, options, placeholder, ...rest }) {
            return (
                <Field label={label} error={error} required={required} id={id}>
                    <select id={id} aria-invalid={!!error} className={inp(error)} {...rest}>
                        {placeholder && <option value="">{placeholder}</option>}
                        {options.map(o => <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>)}
                    </select>
                </Field>
            );
        }
        function Textarea({ label, error, required, id, hint, ...rest }) {
            return <Field label={label} error={error} required={required} id={id} hint={hint}><textarea id={id} rows={4} aria-invalid={!!error} className={cx(inp(error), 'py-3 resize-y')} {...rest} /></Field>;
        }
        function FileField({ label, id, file, onChange, error }) {
            return (
                <Field label={label} id={id} error={error} hint="Demo only: the file stays in your browser and is not uploaded anywhere.">
                    <label htmlFor={id} className="flex items-center gap-3 rounded-xl border border-dashed border-forest/40 bg-mint/50 hover:bg-mint px-4 py-3 cursor-pointer transition focus-within:ring-2 focus-within:ring-forest/40">
                        <Icon name="upload" className="text-forest" />
                        <span className="text-sm text-charcoal truncate">{file ? file.name : 'Choose an image (max 5 MB)'}</span>
                        <input id={id} type="file" accept="image/*" className="sr-only" onChange={e => onChange(e.target.files[0] || null)} />
                    </label>
                </Field>
            );
        }
        function Modal({ open, onClose, title, children, wide }) {
            const ref = useRef(null);
            useEffect(() => {
                if (!open) return;
                const prev = document.activeElement;
                const onKey = e => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', onKey);
                document.body.style.overflow = 'hidden';
                setTimeout(() => { const f = ref.current && ref.current.querySelector('input,select,textarea,button,a'); f && f.focus(); }, 30);
                return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; prev && prev.focus && prev.focus(); };
            }, [open]);
            if (!open) return null;
            return (
                <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4" role="presentation">
                    <div className="absolute inset-0 bg-charcoal/55 backdrop-blur-[2px]" onClick={onClose} />

        /* ============================== RECYCLING REQUESTS ============================== */
        function Recycling() {
            const { toast } = useApp();
            const [requests, setRequests] = usePersist('eco_requests', SEED_REQUESTS);
            const empty = { name: '', email: '', phone: '', address: '', area: '', category: '', quantity: '', date: '', slot: '', notes: '' };
            const [f, setF] = useState(empty);
            const [photo, setPhoto] = useState(null);
            const [errors, setErrors] = useState({});
            const [busy, setBusy] = useState(false);
            const [success, setSuccess] = useState(null);
            const set = k => e => { setF({ ...f, [k]: e.target.value }); if (errors[k]) setErrors({ ...errors, [k]: undefined }); };

            const validate = () => {
                const e = {};
                if (f.name.trim().length < 2) e.name = 'Enter your full name.';
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email)) e.email = 'Enter a valid email, like name@example.com.';
                if (!/^[+()\d\s-]{7,18}$/.test(f.phone) || f.phone.replace(/\D/g, '').length < 7) e.phone = 'Enter a phone number with at least 7 digits.';
                if (f.address.trim().length < 5) e.address = 'Enter the pickup address.';
                if (!f.area.trim()) e.area = 'Enter your area or neighborhood.';
                if (!f.category) e.category = 'Choose a waste category.';
                if (!f.quantity.trim()) e.quantity = 'Estimate the quantity, for example "10 kg" or "2 bags".';
                if (!f.date) e.date = 'Choose a pickup date.'; else if (f.date < todayISO()) e.date = 'Pickup date cannot be in the past.';
                if (!f.slot) e.slot = 'Choose a time slot.';
                if (photo && photo.size > 5 * 1024 * 1024) e.photo = 'Image must be under 5 MB.';
                return e;
            };
            const submit = ev => {
                ev.preventDefault();
                const e = validate(); setErrors(e);
                if (Object.keys(e).length) { toast('Please fix the highlighted fields.', 'error'); const el = document.getElementById('req-' + Object.keys(e)[0]); el && el.focus(); return; }
                setBusy(true);
                setTimeout(() => {
                    const id = refId('REQ');
                    setRequests([{ id, name: f.name, category: f.category, quantity: f.quantity, date: f.date, slot: f.slot, area: f.area, address: f.address, status: 'Pending', photo: photo ? photo.name : null }, ...requests]);
                    setSuccess(id); setBusy(false); setF(empty); setPhoto(null);
                    toast('Demo request added to your history.');
                }, 1100);
            };
            const cancel = id => { setRequests(requests.map(r => r.id === id ? { ...r, status: 'Cancelled' } : r)); toast('Demo request cancelled.'); };
            const advance = id => setRequests(requests.map(r => { if (r.id !== id) return r; const i = REQ_STATUSES.indexOf(r.status); return i > -1 && i < REQ_STATUSES.length - 1 ? { ...r, status: REQ_STATUSES[i + 1] } : r; }));

            return (
                <>
                    <PageHeader icon="truck" title="Recycling Requests" text="Tell us what you have, where it is, and when suits you. Your request appears in the history on this page." />
                    <Section className="mt-8 grid lg:grid-cols-5 gap-8 items-start">
                        <Card className="lg:col-span-3 p-6 sm:p-8">
                            <h2 className="text-xl font-extrabold text-forest">New pickup request</h2>
                            {success && (
                                <div className="mt-5 rounded-xl bg-mint border border-forest/20 p-4 flex gap-3" role="status">
                                    <Icon name="check" className="text-forest mt-0.5" />
                                    <div><p className="font-bold text-forest">Demo request created</p><p className="text-sm text-charcoal mt-1">Reference number <strong>{success}</strong>. It is now in your request history. Nothing was sent to a real team.</p></div>
                                    <button className="ml-auto self-start p-1 rounded hover:bg-white" aria-label="Dismiss message" onClick={() => setSuccess(null)}><Icon name="x" size={16} /></button>
                                </div>
                            )}
                            <form onSubmit={submit} noValidate className="mt-6 grid sm:grid-cols-2 gap-5">
                                <Input id="req-name" label="Full name" required value={f.name} onChange={set('name')} error={errors.name} autoComplete="name" placeholder="Jordan Rivers" />
                                <Input id="req-email" label="Email address" type="email" required value={f.email} onChange={set('email')} error={errors.email} autoComplete="email" placeholder="you@example.com" />
                                <Input id="req-phone" label="Phone number" type="tel" required value={f.phone} onChange={set('phone')} error={errors.phone} autoComplete="tel" placeholder="(555) 010-1234" />
                                <Input id="req-area" label="Area or neighborhood" required value={f.area} onChange={set('area')} error={errors.area} placeholder="Riverside" />
                                <div className="sm:col-span-2"><Input id="req-address" label="Pickup address" required value={f.address} onChange={set('address')} error={errors.address} autoComplete="street-address" placeholder="14 Willow Lane" /></div>
                                <Select id="req-category" label="Waste category" required value={f.category} onChange={set('category')} error={errors.category} placeholder="Select a category" options={WASTE_CATS} />
                                <Input id="req-quantity" label="Estimated quantity" required value={f.quantity} onChange={set('quantity')} error={errors.quantity} placeholder="e.g. 10 kg or 2 bags" />
                                <Input id="req-date" label="Preferred pickup date" type="date" required min={todayISO()} value={f.date} onChange={set('date')} error={errors.date} />
                                <Select id="req-slot" label="Preferred time slot" required value={f.slot} onChange={set('slot')} error={errors.slot} placeholder="Select a time slot" options={TIME_SLOTS} />
                                <div className="sm:col-span-2"><Textarea id="req-notes" label="Additional instructions" value={f.notes} onChange={set('notes')} placeholder="Gate code, where to leave items, anything else we should know." /></div>
                                <div className="sm:col-span-2"><FileField id="req-photo" label="Photo (optional)" file={photo} onChange={setPhoto} error={errors.photo} /></div>
                                <div className="sm:col-span-2 flex flex-wrap gap-3 pt-1">
                                    <Btn type="submit" loading={busy} size="lg" icon="truck">{busy ? 'Submitting demo request…' : 'Submit demo request'}</Btn>
                                    <Btn variant="ghost" size="lg" onClick={() => { setF(empty); setErrors({}); setPhoto(null); }}>Clear form</Btn>
                                </div>
                            </form>
                        </Card>

                        <div className="lg:col-span-2 space-y-5">
                            <Card className="p-6 bg-mint border-0">
                                <h3 className="font-extrabold text-forest flex items-center gap-2"><Icon name="info" size={18} />Before you request</h3>
                                <ul className="mt-3 space-y-2 text-sm text-charcoal">
                                    {['Rinse containers and keep paper dry.', 'Separate different materials where you can.', 'Batteries and electronics are best kept separate.'].map(t => <li key={t} className="flex gap-2"><Icon name="check" size={16} className="text-forest mt-0.5" />{t}</li>)}
                                </ul>
                            </Card>
                            <div>
                                <div className="flex items-center justify-between mb-3"><h2 className="text-xl font-extrabold text-forest">Request history</h2><Chip tone="gray">{requests.length} total</Chip></div>
                                {requests.length === 0 ? <EmptyState icon="truck" title="No requests yet" text="Submit the form and your demo request will show up here." /> : (
                                    <ul className="space-y-3">
                                        {requests.map(r => (
                                            <li key={r.id}>
                                                <Card className="p-4">
                                                    <div className="flex items-start justify-between gap-3">
                                                        <div><p className="font-bold">{r.category}</p><p className="text-xs text-sage">{r.id}{r.sample ? ' · Sample' : ''}</p></div>
                                                        <StatusBadge status={r.status} />
                                                    </div>
                                                    <dl className="mt-3 grid grid-cols-2 gap-y-1.5 text-sm">
                                                        <dt className="text-sage">Date</dt><dd>{fmtDate(r.date)}</dd>
                                                        <dt className="text-sage">Time</dt><dd>{r.slot.split(' (')[0]}</dd>
                                                        <dt className="text-sage">Quantity</dt><dd>{r.quantity}</dd>
                                                        <dt className="text-sage">Area</dt><dd>{r.area}</dd>
                                                    </dl>
                                                    {r.photo && <p className="text-xs text-sage mt-2 flex items-center gap-1"><Icon name="camera" size={14} />{r.photo}</p>}
                                                    <div className="mt-3 flex flex-wrap gap-2">
                                                        {r.status === 'Pending' && <Btn size="sm" variant="danger" onClick={() => cancel(r.id)}>Cancel request</Btn>}
                                                        {REQ_STATUSES.includes(r.status) && r.status !== 'Collected' && <Btn size="sm" variant="soft" onClick={() => advance(r.id)}>Advance status (demo)</Btn>}
                                                    </div>
                                                </Card>
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </div>
                        </div>
                    </Section>
                </>
            );
        }

        /* ============================== COLLECTION REMINDERS ============================== */
        function occursOn(r, iso) {
            if (iso < r.date) return false;
            if (r.frequency === 'One-time') return iso === r.date;
            const a = parseISO(r.date), b = parseISO(iso);
            if (r.frequency === 'Weekly') return a.getDay() === b.getDay();
            return a.getDate() === b.getDate();
        }
        function nextOccurrence(r) { for (let i = 0; i < 62; i++) { const iso = toISO(addDays(new Date(), i)); if (occursOn(r, iso)) return iso; } return null; }

        function Reminders() {
            const { toast } = useApp();
            const [items, setItems] = usePersist('eco_reminders', SEED_REMINDERS);
            const [view, setView] = useState('list');
            const [modal, setModal] = useState(null);
            const [del, setDel] = useState(null);
            const now = new Date();
            const [cal, setCal] = useState({ y: now.getFullYear(), m: now.getMonth() });
            const [sel, setSel] = useState(todayISO());

            const upcoming = useMemo(() => items.filter(r => r.enabled).map(r => ({ r, next: nextOccurrence(r) })).filter(x => x.next).sort((a, b) => (a.next + a.r.time).localeCompare(b.next + b.r.time)).slice(0, 3), [items]);
            const save = data => {
                if (data.id) { setItems(items.map(r => r.id === data.id ? data : r)); toast('Reminder updated.'); }
                else { setItems([{ ...data, id: uid(), enabled: true }, ...items]); toast('Reminder added.'); }
                setModal(null);
            };
            const toggle = id => setItems(items.map(r => r.id === id ? { ...r, enabled: !r.enabled } : r));
            const first = new Date(cal.y, cal.m, 1), lead = first.getDay(), dim = new Date(cal.y, cal.m + 1, 0).getDate();
            const cells = [...Array(lead).fill(null), ...Array.from({ length: dim }, (_, i) => i + 1)];
            const isoOf = d => `${cal.y}-${pad(cal.m + 1)}-${pad(d)}`;
            const forDay = iso => items.filter(r => occursOn(r, iso)).sort((a, b) => a.time.localeCompare(b.time));
            const shift = n => { const d = new Date(cal.y, cal.m + n, 1); setCal({ y: d.getFullYear(), m: d.getMonth() }); };

            const Row = ({ r }) => (
                <Card className={cx('p-4 flex flex-wrap items-center gap-4', !r.enabled && 'opacity-60')}>
                    <span className="w-11 h-11 rounded-xl bg-mint text-forest grid place-items-center"><Icon name="bell" /></span>
                    <div className="flex-1 min-w-[180px]">
                        <p className="font-bold">{r.title}</p>
                        <p className="text-sm text-sage">{r.category} · {r.frequency === 'Weekly' ? `Every ${DAYS[parseISO(r.date).getDay()]}` : r.frequency === 'Monthly' ? `Monthly on day ${parseISO(r.date).getDate()}` : fmtDate(r.date)} · {fmtTime(r.time)}</p>
                    </div>
                    <Chip tone="gray">{r.frequency}</Chip>
                    <label className="inline-flex items-center gap-2 cursor-pointer text-sm font-semibold">
                        <span className="relative inline-block w-11 h-6">
                            <input type="checkbox" className="peer sr-only" checked={r.enabled} onChange={() => toggle(r.id)} aria-label={`${r.enabled ? 'Disable' : 'Enable'} ${r.title}`} />
                            <span className="absolute inset-0 rounded-full bg-stone-300 peer-checked:bg-forest transition peer-focus-visible:ring-2 peer-focus-visible:ring-sun" />
                            <span className="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full transition peer-checked:translate-x-5" />
                        </span>{r.enabled ? 'On' : 'Off'}
                    </label>
                    <div className="flex gap-1">
                        <button className="p-2.5 rounded-lg hover:bg-mint" aria-label={`Edit ${r.title}`} onClick={() => setModal(r)}><Icon name="edit" size={18} /></button>
                        <button className="p-2.5 rounded-lg hover:bg-[#fdeeee] text-[#9b2c2c]" aria-label={`Delete ${r.title}`} onClick={() => setDel(r)}><Icon name="trash" size={18} /></button>
                    </div>
                </Card>
            );

            return (
                <>
                    <PageHeader icon="bell" title="Collection Reminders" text="Keep track of collection days for each type of waste. Add, edit, pause, or remove reminders below.">
                        <Btn icon="plus" size="lg" onClick={() => setModal({})}>Add reminder</Btn>
                    </PageHeader>

                    <Section className="mt-10">
                        <h2 className="text-xl font-extrabold text-forest">Upcoming collections</h2>
                        {upcoming.length === 0 ? <div className="mt-4"><EmptyState icon="bell" title="Nothing coming up" text="Turn a reminder on or add a new one to see upcoming collections here." action={<Btn onClick={() => setModal({})} icon="plus">Add reminder</Btn>} /></div> : (
                            <div className="mt-4 grid md:grid-cols-3 gap-4">
                                {upcoming.map(({ r, next }, i) => (
                                    <Card key={r.id} className={cx('p-5', i === 0 && 'bg-forest text-white border-0')}>
                                        <p className={cx('text-sm font-semibold', i === 0 ? 'text-white/80' : 'text-sage')}>{next === todayISO() ? 'Today' : DAYS[parseISO(next).getDay()]}, {fmtDate(next)}</p>
                                        <p className="mt-1 text-xl font-extrabold">{r.title}</p>
                                        <p className={cx('mt-3 text-sm flex items-center gap-2', i === 0 ? 'text-white/90' : 'text-charcoal')}><Icon name="clock" size={16} />{fmtTime(r.time)}<span className="opacity-60">·</span>{r.category}</p>
                                    </Card>
                                ))}
                            </div>

                    </Modal>

        function ReminderModal({ data, onClose, onSave }) {
            const blank = { title: '', category: 'Paper', date: todayISO(), time: '09:00', frequency: 'Weekly' };
            const [f, setF] = useState(blank); const [err, setErr] = useState({});

            if (!data) return null;
            const set = k => e => setF({ ...f, [k]: e.target.value });
            const go = e => {
                e.preventDefault(); const er = {};

        /* ============================== WASTE REPORTING ============================== */
        function Report() {
            const { toast } = useApp();
            const [reports, setReports] = usePersist('eco_reports', SEED_REPORTS);
            const empty = { title: '', category: '', description: '', location: '', date: '' };
            const [f, setF] = useState(empty); const [photo, setPhoto] = useState(null); const [err, setErr] = useState({});
            const [busy, setBusy] = useState(false); const [ok, setOk] = useState(null);
            const [fc, setFc] = useState('All'); const [fs, setFs] = useState('All');
            const set = k => e => { setF({ ...f, [k]: e.target.value }); if (err[k]) setErr({ ...err, [k]: undefined }); };
            const submit = ev => {
                ev.preventDefault(); const e = {};
                if (f.title.trim().length < 4) e.title = 'Enter a short title (at least 4 characters).';
                if (!f.category) e.category = 'Choose an issue category.';
                if (f.description.trim().length < 15) e.description = 'Describe the issue in at least 15 characters.';
                if (f.location.trim().length < 4) e.location = 'Enter a location or address.';
                if (!f.date) e.date = 'Choose the date you saw the issue.'; else if (f.date > todayISO()) e.date = 'Date observed cannot be in the future.';
                if (photo && photo.size > 5 * 1024 * 1024) e.photo = 'Image must be under 5 MB.';
                setErr(e);
                if (Object.keys(e).length) { toast('Please fix the highlighted fields.', 'error'); const el = document.getElementById('rp-' + Object.keys(e)[0]); el && el.focus(); return; }
                setBusy(true);
                setTimeout(() => {
                    const id = refId('RPT');
                    setReports([{ id, ...f, status: 'Submitted', photo: photo ? photo.name : null }, ...reports]);
                    setOk(id); setBusy(false); setF(empty); setPhoto(null); toast('Demo report added to the history.');
                }, 1000);
            };
            const shown = reports.filter(r => (fc === 'All' || r.category === fc) && (fs === 'All' || r.status === fs));
            const advance = id => setReports(reports.map(r => { if (r.id !== id) return r; const i = REPORT_STATUSES.indexOf(r.status); return i < REPORT_STATUSES.length - 1 ? { ...r, status: REPORT_STATUSES[i + 1] } : r; }));
            return (
                <>
                    <PageHeader icon="alert" title="Waste Reporting" text="Spotted a pile of rubbish, an overflowing bin, or a missed collection? Describe it here and track it in the report history." />
                    <Section className="mt-8 grid lg:grid-cols-5 gap-8 items-start">
                        <Card className="lg:col-span-2 p-6 sm:p-7">
                            <h2 className="text-xl font-extrabold text-forest">Submit a report</h2>
                            {ok && <div className="mt-4 rounded-xl bg-mint border border-forest/20 p-4 flex gap-3" role="status"><Icon name="check" className="text-forest mt-0.5" /><div><p className="font-bold text-forest">Demo report created</p><p className="text-sm mt-1">Report ID <strong>{ok}</strong>. It was not sent to any authority.</p></div></div>}
                            <form onSubmit={submit} noValidate className="mt-5 space-y-5">
                                <Input id="rp-title" label="Report title" required value={f.title} onChange={set('title')} error={err.title} placeholder="Bags dumped behind the depot" />
                                <Select id="rp-category" label="Waste issue category" required value={f.category} onChange={set('category')} error={err.category} placeholder="Select a category" options={Object.keys(REPORT_CATS)} />
                                <Textarea id="rp-description" label="Description" required value={f.description} onChange={set('description')} error={err.description} placeholder="What did you see, and how big is the problem?" />
                                <Input id="rp-location" label="Location or address" required value={f.location} onChange={set('location')} error={err.location} placeholder="Elm Street near the corner shop" />
                                <Input id="rp-date" label="Date observed" type="date" required max={todayISO()} value={f.date} onChange={set('date')} error={err.date} />
                                <FileField id="rp-photo" label="Photo (optional)" file={photo} onChange={setPhoto} error={err.photo} />
                                <Btn type="submit" loading={busy} size="lg" className="w-full" icon="flag">{busy ? 'Submitting…' : 'Submit demo report'}</Btn>
                            </form>
                        </Card>
                        <div className="lg:col-span-3">
                            <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                                <h2 className="text-xl font-extrabold text-forest">Report history</h2>
                                <div className="flex gap-2 flex-wrap">
                                    <div className="w-44"><select aria-label="Filter by category" className={inp()} value={fc} onChange={e => setFc(e.target.value)}><option>All</option>{Object.keys(REPORT_CATS).map(c => <option key={c}>{c}</option>)}</select></div>
                                    <div className="w-40"><select aria-label="Filter by status" className={inp()} value={fs} onChange={e => setFs(e.target.value)}><option>All</option>{REPORT_STATUSES.map(c => <option key={c}>{c}</option>)}</select></div>
                                </div>
                            </div>
                            <p className="text-sm text-sage mb-3" aria-live="polite">Showing {shown.length} of {reports.length} reports</p>
                            {shown.length === 0 ? <EmptyState icon="search" title="No reports match" text="Try a different category or status." action={<Btn variant="soft" onClick={() => { setFc('All'); setFs('All'); }}>Clear filters</Btn>} /> : (
                                <ul className="space-y-3">{shown.map(r => (
                                    <li key={r.id}><Card className="p-5">
                                        <div className="flex gap-4">
                                            <span className="w-11 h-11 rounded-xl bg-mint text-forest grid place-items-center shrink-0"><Icon name={REPORT_CATS[r.category]} /></span>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-start justify-between gap-3 flex-wrap"><h3 className="font-bold leading-snug">{r.title}</h3><StatusBadge status={r.status} /></div>
                                                <p className="text-sm text-sage mt-1">{r.description}</p>

                                                    <span className="flex items-center gap-1"><Icon name="pin" size={14} />{r.location}</span>
                                                    <span className="flex items-center gap-1"><Icon name="calendar" size={14} />{fmtDate(r.date)}</span>
                                                    <span>{r.category}</span><span>{r.id}{r.sample ? ' · Sample' : ''}</span>
                                                </div>
                                                {r.status !== 'Resolved' && <Btn size="sm" variant="soft" className="mt-3" onClick={() => advance(r.id)}>Advance status (demo)</Btn>}
                                            </div>
                                        </div>
                                    </Card></li>
                                ))}</ul>
                            )}
                        </div>
                    </Section>
                </>
            );
        }

        /* ============================== CENTERS ============================== */

        /* ============================== LEARN ============================== */

                        <div className="mt-4 flex flex-wrap gap-2">
                            {matches.map(s => <button key={s.item} aria-pressed={pick && pick.item === s.item} onClick={() => setPick(s)} className={cx('px-3.5 min-h-[40px] rounded-full text-sm font-semibold border transition', pick && pick.item === s.item ? 'bg-forest text-white border-forest' : 'bg-white border-forest/20 hover:bg-mint')}>{s.item}</button>)}
                            {matches.length === 0 && <p className="text-sm text-sage">No match. Try another word, or check your local guidelines.</p>}
                        </div>
                    </Card>
                    <Card className="p-6 sm:p-8 bg-mint border-0" aria-live="polite">
                        {pick ? <>
                            <p className="text-sm font-semibold text-sage">{pick.item}</p>
                            <p className={cx('mt-2 inline-block rounded-xl px-4 py-2 font-extrabold text-lg', tone[pick.tone])}>{pick.cat}</p>
                            <ul className="mt-5 space-y-3">{pick.tips.map(t => <li key={t} className="flex gap-3"><Icon name="check" className="text-forest mt-0.5" size={18} />{t}</li>)}</ul>
                        </> : <p>Select an item to see guidance.</p>}
                        <p className="mt-6 text-xs text-sage flex gap-2"><Icon name="info" size={16} />Recycling rules vary by location. Use this as general guidance and confirm with your local service.</p>
                    </Card>
                </div>
            );
        }
        function Quiz() {
            const [i, setI] = useState(0); const [pick, setPick] = useState(null); const [score, setScore] = useState(0); const [done, setDone] = useState(false);
            const cur = QUIZ[i];
            const choose = n => { if (pick !== null) return; setPick(n); if (n === cur.a) setScore(s => s + 1); };
            const next = () => { if (i + 1 >= QUIZ.length) setDone(true); else { setI(i + 1); setPick(null); } };
            const restart = () => { setI(0); setPick(null); setScore(0); setDone(false); };
            return (
                <Card className="p-6 sm:p-10 max-w-3xl mx-auto">
                    <div className="flex items-center justify-between"><h2 className="text-2xl font-extrabold text-forest">Recycling quiz</h2>{!done && <Chip tone="gray">Score {score}</Chip>}</div>
                    {done ? (
                        <div className="text-center py-6" role="status">
                            <div className="mx-auto w-16 h-16 rounded-2xl bg-sun grid place-items-center"><Icon name="trophy" size={32} /></div>
                            <p className="mt-4 text-4xl font-extrabold text-forest">{score} / {QUIZ.length}</p>
                            <p className="mt-2 text-sage">{score === QUIZ.length ? 'Perfect score. You really know your recycling.' : score >= 4 ? 'Great work. A few details to polish.' : 'Good start. Browse the guides and try again.'}</p>
                            <div className="mt-6 flex gap-3 justify-center flex-wrap"><Btn onClick={restart} icon="loader">Restart quiz</Btn><Btn variant="outline" onClick={() => document.getElementById('sorter').scrollIntoView({ behavior: 'smooth' })}>Use the sorting guide</Btn></div>
                        </div>
                    ) : (
                        <div className="mt-5">
                            <div className="h-2 rounded-full bg-mint overflow-hidden" role="progressbar" aria-valuemin={0} aria-valuemax={QUIZ.length} aria-valuenow={i + 1} aria-label="Quiz progress"><div className="h-full bg-forest transition-all" style={{ width: `${((i + (pick !== null ? 1 : 0)) / QUIZ.length) * 100}%` }} /></div>
                            <p className="mt-4 text-sm text-sage">Question {i + 1} of {QUIZ.length}</p>
                            <h3 className="mt-1 text-xl font-bold">{cur.q}</h3>
                            <div className="mt-5 grid gap-3">
                                {cur.o.map((o, n) => {
                                    const state = pick === null ? '' : n === cur.a ? 'ok' : n === pick ? 'bad' : 'dim';
                                    return <button key={o} onClick={() => choose(n)} disabled={pick !== null} className={cx('text-left rounded-xl border px-4 py-3.5 font-semibold transition flex items-center gap-3 min-h-[52px]', !state && 'bg-white border-forest/20 hover:bg-mint hover:border-forest', state === 'ok' && 'bg-mint border-forest text-forest', state === 'bad' && 'bg-[#fdeeee] border-[#b03030] text-[#8a2323]', state === 'dim' && 'opacity-50 bg-white border-forest/10')}>
                                        <span className="w-7 h-7 rounded-full border border-current grid place-items-center text-xs shrink-0">{state === 'ok' ? <Icon name="check" size={14} /> : state === 'bad' ? <Icon name="x" size={14} /> : String.fromCharCode(65 + n)}</span>{o}</button>;
                                })}
                            </div>
                            {pick !== null && (
                                <div className="mt-5 rounded-xl bg-ivory border border-forest/10 p-4" role="status">
                                    <p className="font-bold">{pick === cur.a ? 'Correct!' : 'Not quite.'}</p><p className="text-sm text-sage mt-1">{cur.why}</p>
                                    <Btn className="mt-4" onClick={next} iconRight="arrow">{i + 1 >= QUIZ.length ? 'See results' : 'Next question'}</Btn>
                                </div>
                            )}
                        </div>
                    )}
                </Card>
            );
        }

        /* ============================== IMPACT ============================== */
        function BarChart({ data }) {
            const [hi, setHi] = useState(null);
            const max = 250, W = 600, H = 280, L = 40, B = 36, bw = 44, gap = (W - L - bw * data.length) / (data.length + 1);
            return (
                <div>
                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label={`Bar chart of monthly waste collected in kilograms (demo data): ${data.map(d => `${d.m} ${d.v}`).join(', ')}`}>
                        {[0, 50, 100, 150, 200, 250].map(t => { const y = H - B - (t / max) * (H - B - 20); return <g key={t}><line x1={L} x2={W} y1={y} y2={y} stroke="#176B4D" strokeOpacity=".12" /><text x={L - 8} y={y + 4} textAnchor="end" fontSize="11" fill="#68776C">{t}</text></g>; })}
                        {data.map((d, i) => {
                            const h = (d.v / max) * (H - B - 20), x = L + gap + i * (bw + gap), y = H - B - h; return (
                                <g key={d.m} onMouseEnter={() => setHi(i)} onMouseLeave={() => setHi(null)} onFocus={() => setHi(i)} onBlur={() => setHi(null)} tabIndex={0} aria-label={`${d.m}: ${d.v} kg`}>
                                    <rect x={x} y={y} width={bw} height={h} rx="8" fill={hi === i ? '#F2B84B' : '#176B4D'} className="transition" />
                                    <text x={x + bw / 2} y={H - 14} textAnchor="middle" fontSize="12" fontWeight="600" fill="#26352B">{d.m}</text>
                                    {hi === i && <text x={x + bw / 2} y={y - 8} textAnchor="middle" fontSize="13" fontWeight="800" fill="#26352B">{d.v} kg</text>}
                                </g>);
                        })}
                    </svg>
                </div>
            );
        }
        function Donut({ data }) {
            const total = data.reduce((s, d) => s + d.v, 0); let acc = 0; const r = 70, C = 2 * Math.PI * r;
            return (
                <div className="flex flex-col sm:flex-row items-center gap-6">
                    <svg viewBox="0 0 200 200" className="w-48 h-48 shrink-0" role="img" aria-label={`Donut chart of waste categories (demo data): ${data.map(d => `${d.n} ${d.v}%`).join(', ')}`}>
                        <g transform="rotate(-90 100 100)">{data.map(d => { const len = (d.v / total) * C, el = <circle key={d.n} cx="100" cy="100" r={r} fill="none" stroke={d.c} strokeWidth="30" strokeDasharray={`${len - 2} ${C - len + 2}`} strokeDashoffset={-acc} />; acc += len; return el; })}</g>
                        <text x="100" y="98" textAnchor="middle" fontSize="22" fontWeight="800" fill="#176B4D">{total}%</text><text x="100" y="116" textAnchor="middle" fontSize="11" fill="#68776C">of demo total</text>
                    </svg>
                    <ul className="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">{data.map(d => <li key={d.n} className="flex items-center gap-2"><span className="w-3 h-3 rounded-full" style={{ background: d.c }} />{d.n} <strong className="ml-auto">{d.v}%</strong></li>)}</ul>
                </div>
            );
        }
        function Impact() {
            const { toast } = useApp();
            const [joined, setJoined] = usePersist('eco_challenges', {});
            const [tip, setTip] = useState(0); const [camp, setCamp] = useState(null);
            const kpis = [['1,250 kg', 'Total waste collected', 'scale'], ['320', 'Recycling pickups completed', 'truck'], ['96', 'Waste reports resolved', 'check'], ['185', 'Community participants', 'users']];
            const prog = [['Recycling rate target', 72], ['Households participating', 58], ['Reports resolved within 14 days', 84]];
            return (
                <>
                    <PageHeader icon="trend" title="Community Impact" text="A sample dashboard showing how a community's recycling efforts could be tracked." />
                    <Section className="mt-8 grid grid-cols-2 lg:grid-cols-4 gap-4">
                        {kpis.map(([v, l, ic], i) => <Card key={l} className={cx('p-5', i === 0 && 'bg-forest text-white border-0')}><Icon name={ic} className={i === 0 ? 'text-sun' : 'text-leaf'} size={26} /><p className="mt-3 text-3xl font-extrabold">{v}</p><p className={cx('text-sm font-semibold mt-1', i === 0 ? 'text-white/80' : 'text-sage')}>{l}</p></Card>)}
                    </Section>
                    <Section className="mt-6 grid lg:grid-cols-5 gap-6">
                        <Card className="lg:col-span-3 p-6"><div className="flex items-center justify-between mb-2"><h2 className="font-extrabold text-lg text-forest">Monthly waste collection (kg)</h2><Chip tone="sun">Demo data</Chip></div><BarChart data={MONTHLY} /></Card>
                        <Card className="lg:col-span-2 p-6"><div className="flex items-center justify-between mb-5"><h2 className="font-extrabold text-lg text-forest">Waste by category</h2><Chip tone="sun">Demo data</Chip></div><Donut data={BREAKDOWN} /></Card>
                    </Section>
                    <Section className="mt-6">
                        <Card className="p-6"><h2 className="font-extrabold text-lg text-forest">Community progress</h2>
                            <div className="mt-5 grid md:grid-cols-3 gap-6">{prog.map(([l, v]) => (
                                <div key={l}><div className="flex justify-between text-sm font-semibold"><span>{l}</span><span>{v}%</span></div><div className="mt-2 h-3 rounded-full bg-mint overflow-hidden" role="progressbar" aria-valuenow={v} aria-valuemin={0} aria-valuemax={100} aria-label={l}><div className="h-full bg-leaf rounded-full" style={{ width: v + '%' }} /></div></div>
                            ))}</div></Card>
                    </Section>
                    <Section className="mt-14">
                        <h2 className="text-2xl font-extrabold text-forest">Environmental awareness campaigns</h2>
                        <div className="mt-5 grid md:grid-cols-3 gap-5">{CAMPAIGNS.map(c => (
                            <Card key={c.t} hover className="p-6 flex flex-col"><span className="w-12 h-12 rounded-xl bg-mint text-forest grid place-items-center"><Icon name={c.icon} size={24} /></span><h3 className="mt-4 font-extrabold text-lg">{c.t}</h3><p className="text-sm text-sage mt-1 flex items-center gap-1.5"><Icon name="calendar" size={14} />{c.d}</p><div className="mt-auto pt-5"><Btn size="sm" variant="soft" onClick={() => setCamp(c)}>Learn more</Btn></div></Card>
                        ))}</div>
                    </Section>
                    <Section className="mt-14 grid lg:grid-cols-5 gap-6">
                        <div className="lg:col-span-3">
                            <h2 className="text-2xl font-extrabold text-forest">Monthly recycling challenges</h2>
                            <div className="mt-5 space-y-4">{CHALLENGES.map(c => {
                                const j = joined[c.id]; const val = j ? Math.min(c.goal, c.base + (j.n || 0)) : c.base; const pct = Math.round((val / c.goal) * 100);
                                return (
                                    <Card key={c.id} className="p-5">
                                        <div className="flex items-start justify-between gap-3 flex-wrap"><div><h3 className="font-bold">{c.t}</h3><p className="text-sm text-sage">{val} of {c.goal} {c.unit} (demo)</p></div>
                                            <div className="flex gap-2">{j && <Btn size="sm" variant="soft" disabled={val >= c.goal} onClick={() => setJoined({ ...joined, [c.id]: { n: (j.n || 0) + 1 } })}>Log progress</Btn>}
                                                <Btn size="sm" variant={j ? 'outline' : 'primary'} onClick={() => { setJoined({ ...joined, [c.id]: j ? undefined : { n: 0 } }); toast(j ? 'Left challenge (demo).' : 'Joined challenge (demo).'); }}>{j ? 'Leave' : 'Join challenge'}</Btn></div></div>
                                        <div className="mt-3 h-2.5 rounded-full bg-mint overflow-hidden" role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100} aria-label={c.t}><div className={cx('h-full rounded-full transition-all', pct >= 100 ? 'bg-sun' : 'bg-forest')} style={{ width: pct + '%' }} /></div>
                                    </Card>);
                            })}</div>
                        </div>
                        <div className="lg:col-span-2">
                            <h2 className="text-2xl font-extrabold text-forest">Community tips</h2>
                            <Card className="mt-5 p-6 bg-mint border-0" aria-live="polite"><Icon name="sprout" size={28} className="text-forest" /><p className="mt-4 text-lg font-semibold leading-relaxed">{TIPS[tip]}</p><div className="mt-5 flex items-center justify-between"><span className="text-sm text-sage">Tip {tip + 1} of {TIPS.length}</span><Btn size="sm" onClick={() => setTip((tip + 1) % TIPS.length)} iconRight="arrow">Next tip</Btn></div></Card>
                        </div>
                    </Section>
                    <Modal open={!!camp} onClose={() => setCamp(null)} title={camp ? camp.t : ''}>{camp && <><p className="text-sage flex items-center gap-2"><Icon name="calendar" size={16} />{camp.d}</p><p className="mt-3 leading-relaxed">{camp.text}</p><div className="mt-6 flex gap-3"><Btn to="/learn" onClick={() => setCamp(null)}>Explore guides</Btn><Btn variant="ghost" onClick={() => setCamp(null)}>Close</Btn></div></>}</Modal>
                </>
            );
        }

        /* ============================== APP ============================== */
        function useRoute() {
            const get = () => (location.hash.replace(/^#/, '') || '/');
            const [r, setR] = useState(get);
            useEffect(() => { const h = () => { setR(get()); window.scrollTo(0, 0); }; window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
            return r;
        }
        function App() {
            const route = useRoute();
            const [toasts, setToasts] = useState([]);
            const [start, setStart] = useState(false); const [faq, setFaq] = useState(false); const [reset, setReset] = useState(false);
            const toast = useCallback((msg, type = 'ok') => { const id = uid(); setToasts(t => [...t, { id, msg, type }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3800); }, []);
            const dismiss = id => setToasts(t => t.filter(x => x.id !== id));
            useEffect(() => { if (!location.hash) location.hash = '#/'; }, []);
            let page;
            if (route.startsWith('/learn')) page = <Learn articleId={route.split('/')[2]} />;
            else if (route === '/recycling') page = <Recycling />;
            else if (route === '/reminders') page = <Reminders />;
            else if (route === '/report') page = <Report />;
            else if (route === '/centers') page = <Centers />;
            else if (route === '/impact') page = <Impact />;
            else page = <Home />;
            return (
                <AppCtx.Provider value={{ toast }}>
                    <a href="#main" onClick={e => { e.preventDefault(); document.getElementById('main').focus(); }} className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:bg-white focus:px-4 focus:py-2 focus:rounded-lg">Skip to content</a>
                    <Navbar route={route} openStart={() => setStart(true)} />
                    <main id="main" tabIndex={-1} key={route.split('/').slice(0, 2).join('/')} className="min-h-[70vh] outline-none">{page}</main>
                    <Footer onFaq={() => setFaq(true)} onReset={() => setReset(true)} />
                    <Modal open={start} onClose={() => setStart(false)} title="Where would you like to start?">
                        <ul className="grid gap-3">{ALL_PAGES.map(([p, t, d, ic]) => (
                            <li key={p}><a href={'#' + p} onClick={() => setStart(false)} className="flex items-center gap-4 rounded-xl border border-forest/15 p-4 hover:bg-mint hover:border-forest transition"><span className="w-11 h-11 rounded-xl bg-mint text-forest grid place-items-center"><Icon name={ic} /></span><span className="flex-1"><span className="block font-bold">{t}</span><span className="text-sm text-sage">{d}</span></span><Icon name="chev" className="text-sage" /></a></li>
                        ))}</ul>
                    </Modal>
                    <Modal open={faq} onClose={() => setFaq(false)} title="Frequently asked questions">
                        <dl className="space-y-5">{FAQS.map(([q, a]) => <div key={q}><dt className="font-bold">{q}</dt><dd className="text-sage mt-1">{a}</dd></div>)}</dl>
                    </Modal>
                    <Modal open={reset} onClose={() => setReset(false)} title="Reset demo data?">
                        <p className="text-sage">This clears requests, reports, reminders, and challenge progress saved in this browser and restores the sample content.</p>
                        <div className="mt-6 flex gap-3 justify-end"><Btn variant="ghost" onClick={() => setReset(false)}>Cancel</Btn><Btn icon="loader" onClick={() => { ['eco_requests', 'eco_reports', 'eco_reminders', 'eco_challenges'].forEach(k => { try { localStorage.removeItem(k); } catch (e) { } }); location.reload(); }}>Reset demo data</Btn></div>
                    </Modal>
                    <Toasts items={toasts} dismiss={dismiss} />
                </AppCtx.Provider>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
